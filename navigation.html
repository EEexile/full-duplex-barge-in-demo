</main><script>
(() => {
  const cards = [...document.querySelectorAll(".intent-card")];
  const phases = {
    ack: [[0, "AI 正在播报"], [1.705, "AI 暂停，真人说「对对对」"], [2.885, "AI 接着讲原来的安排"]],
    interrupt: [[0, "AI 正在播报"], [3.395, "AI 停播，只听真人说"], [9.075, "AI 开始回应周五时间的问题"]],
  };
  for (const card of cards) {
    const audio = card.querySelector("audio");
    const label = card.querySelector(".intent-state");
    const initial = label.textContent;
    const steps = phases[label.dataset.example];
    audio.addEventListener("play", () => {
      for (const other of cards) {
        const player = other.querySelector("audio");
        if (player !== audio) player.pause();
      }
    });
    audio.addEventListener("timeupdate", () => {
      label.textContent = steps.reduce((text, [start, value]) => audio.currentTime >= start ? value : text, initial);
    });
    audio.addEventListener("ended", () => { label.textContent = initial; });
  }
})();
