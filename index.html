<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101619">
<title>全双工语音通话 Demo</title>
<link rel="stylesheet" href="call.css">
<script src="call.js" defer></script>
</head>
<body>
<main>
  <header class="page-header">
    <div><h1>全双工语音通话 Demo</h1><p>预约改期 · 在 AI 说话时直接开口</p></div>
    <a href="https://github.com/EEexile/full-duplex-barge-in-demo">项目与架构 ↗</a>
  </header>
  <div class="dashboard">
    <section class="panel signals" aria-labelledby="signal-title">
      <h2 id="signal-title">当前判断</h2>
      <dl>
        <div><dt>麦克风</dt><dd id="mic-state">未开启</dd></div>
        <div><dt>四分类</dt><dd id="classification">—</dd></div>
        <div><dt>话轮</dt><dd id="turn-state">—</dd></div>
        <div><dt>播报动作</dt><dd id="playback-state">—</dd></div>
      </dl>
      <details><summary>试说几句</summary>
        <ul>
          <li>「对对对」<span>停一拍，接着说</span></li>
          <li>「我想改一下预约」<span>听清发言后停播</span></li>
          <li>「等一下」<span>识别后停播，让你说</span></li>
          <li>「我想改到……」<span>接着说「明天下午四点」</span></li>
        </ul>
      </details>
    </section>
    <section class="panel phone" aria-label="预约助手通话">
      <p class="call-name">预约助手</p>
      <div class="orb" id="orb" data-phase="idle">
        <div class="wave" id="wave" aria-hidden="true"></div>
        <strong id="call-state" role="status">等待接通</strong>
        <time id="elapsed">00:00</time>
      </div>
      <button id="call" class="call-button">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8.1 3.4 5.5 3a2 2 0 0 0-2.2 2.1c.5 7.6 6.6 13.7 14.2 14.2a2 2 0 0 0 2.1-2.2l-.4-2.6a1 1 0 0 0-.7-.8l-3.2-.9a1 1 0 0 0-1 .2l-1.7 1.7a13.4 13.4 0 0 1-5.3-5.3L9 7.7a1 1 0 0 0 .2-1l-.9-3.2Z"/></svg>
        <span>接通电话</span>
      </button>
      <button id="text-call" class="quiet-button">用文字体验</button>
      <p class="note" id="hint">建议戴耳机。开启后，麦克风音频可能由浏览器的语音服务处理。</p>
      <form id="message" hidden>
        <label class="sr-only" for="message-text">输入你想说的话</label>
        <input id="message-text" maxlength="120" placeholder="比如：等一下" autocomplete="off" required>
        <button type="submit">发送</button>
      </form>
      <div class="shortcuts" id="shortcuts" hidden aria-label="试说台词">
        <button type="button">对对对</button><button type="button">等一下</button><button type="button">我想改到</button><button type="button">明天下午四点</button>
      </div>
    </section>
    <section class="panel trace" aria-labelledby="trace-title">
      <h2 id="trace-title">通话事件</h2>
      <p id="empty-events" class="empty">接通后显示判断和播报动作。</p>
      <ol id="events" aria-live="polite" aria-relevant="additions"></ol>
    </section>
    <section class="panel conversation" aria-labelledby="conversation-title">
      <h2 id="conversation-title">通话记录</h2>
      <p id="empty-transcript" class="empty">还没有通话。</p>
      <ol id="transcript" aria-live="polite" aria-relevant="additions text"></ol>
      <p id="partial"></p>
    </section>
  </div>

</main>
<audio id="speaker" preload="auto" src="call-greeting.m4a"></audio>
</body>
</html>
